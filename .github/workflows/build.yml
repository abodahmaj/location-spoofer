name: Build IPA and Create Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Install Dependencies
        run: |
          brew install xcodegen fastlane
          cd Core/
          go mod download
          cd ../

      - name: Build Go Core (proxy)
        run: |
          cd Core/
          go build -o location-spoofer-core .
          cd ../
          mv Core/location-spoofer-core ./dist/
          ls -lh dist/

      - name: Archive iOS App (with Localization)
        run: |
          echo "Building iOS app with Arabic localization..."
          
          xcodebuild \
            -workspace location-spoofer.xcworkspace \
            -scheme "location-spoofer" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log || echo "Archive completed with warnings (manual signing required)"

      - name: Create Payload Directory
        run: |
          mkdir -p ~/Payloads/location-spoofer
          ls -la ~/Payloads/

      - name: Export IPA from Archive
        id: export
        run: |
          XCARCHIVE_PATH=$(find ~/Build/Products -name "*.xcarchive" -type d 2>/dev/null | head -1)
          
          if [ -z "$XCARCHIVE_PATH" ]; then
            echo "No xcarchive found in ~/Build/Products"
            exit 1
          fi
          
          echo "Found archive at: $XCARCHIVE_PATH"
          
          xcodebuild -exportArchive \
            -archivePath "$XCARCHIVE_PATH" \
            -exportPath ~/Payloads/location-spoofer/export \
            -exportOptionsPlist .github/workflows/export_options.plist

      - name: Rename IPA File
        run: |
          cd ~/Payloads/location-spoofer/export || exit 1
          
          for file in *.ipa; do
            if [ -f "$file" ]; then
              mv "$file" "PaopaoLocationSpoofer-${{ github.ref_name }}.ipa"
              echo "Renamed: $file to PaopaoLocationSpoofer-${{ github.ref_name }}.ipa"
            fi
          done
          
          ls -lh *.ipa

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ~/Payloads/location-spoofer/export/*.ipa
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-arabic-strings:
    name: Validate Arabic Translation Files
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Check Localization Files Exist
        run: |
          echo "Checking localization files..."
          
          FILES=(
            "Resources/Info.plist"
            "Arabic/Localizable.strings"
            "Arabic/Settings.strings"
          )
          
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(wc -c < "$file")
              echo "OK: $file (${SIZE} bytes)"
            else
              echo "Missing: $file"
              exit 1
            fi
          done
          
          echo "All localization files verified!"
