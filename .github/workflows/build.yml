name: Build IPA and Create Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Dependencies
        run: |
          brew install xcodegen
          cd Core && go mod download

      - name: Build Go Core Binary
        run: |
          echo "Building Go Core binary..."
          cd Core
          # Clean previous builds
          rm -f location-spoofers-core
          # Build the core binary (not iOS yet, just CPU binary)
          go build -o location-spoofers-core main.go
          echo "✅ Go Core built: location-spoofers-core"
          ls -la location-spoofers-core

      - name: Create dist directory
        run: |
          mkdir -p dist
          cp Core/location-spoofers-core dist/

      - name: Archive iOS App (with Localization)
        run: xcodebuild archive \
          -workspace PaopaoLocationSpoofer.xcworkspace \
          -scheme PaopaoLocationSpoofer \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -archivePath dist/PaopaoLocationSpoofer.xcarchive archive

      - name: Export IPA from Archive
        run: |
          unzip -o dist/PaopaoLocationSpoofer.xcarchive/Contents/Resources/Plugins/*.framework -d dist/
          mkdir -p Payload
          cp -R dist/PaopaoLocationSpoofer.app Payload/
          mv Payload/PaopaoLocationSpoofer.app Payload/PaopaoLocationSpoofer.app

      - name: Rename IPA File
        run: |
          mv Payload PaopaoLocationSpoofer-unsigned.ipa Payload/
          echo "✅ IPA created: Payload/PaopaoLocationSpoofer-unsigned.ipa"

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: Payload/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
